<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TGC Client Health</title>
    <!-- Linked here rather than imported from src/main.tsx, deliberately. The
         boot fallback below and the startup-error screen both exist for the
         case where the JavaScript failed; styling that arrives through the
         bundle would be missing at exactly the moment those screens are all the
         user has. Vite processes these hrefs at build time, hashes the output
         and rewrites them under the /tgc-client-health/ base. -->
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <!-- Classic and inline, like the boot-slow timer below, and in <head> so it
         runs before the first paint rather than after it.

         main.tsx mounts React through a DYNAMIC import, deliberately -- that is
         what turns a missing environment variable into a message instead of a
         blank page. The cost is that the mount is late, so an attribute set by
         React would leave somebody who chose Dark looking at a light page for
         the whole bundle fetch.

         Only the OVERRIDE needs this. The `system` state is the media query in
         tokens.css, which is already correct on the first paint with no
         JavaScript at all.

         The key and the attribute are duplicated from src/styles/theme.ts,
         which this cannot import because it runs before the bundle exists.
         tests/bootTheme.test.ts fails if the two ever disagree. -->
    <script>
      try {
        var stored = localStorage.getItem('theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored)
        }
      } catch (ignored) {
        // Safari in private browsing throws on the access itself. No stored
        // preference simply means follow the OS, which the media query does.
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Replaced the instant React mounts: createRoot().render() clears the
           container. So if this text is still on screen, the app never started
           — the bundle failed to load, or it threw on the way in. src/main.tsx
           catches the throw and writes a specific message here instead; this
           fallback covers the case where main.tsx itself never ran, which is
           the one case no JavaScript in the bundle can report. -->
      <p class="t-body prose">Starting TGC Client Health…</p>
      <!-- Hidden until the timer below reveals it. It used to be visible from
           the first paint, which meant an unstyled paragraph reading "the app
           did not start" was on screen for the whole serial window — index
           chunk downloaded, parsed and executed, only THEN the App chunk
           requested — on every single load, including every successful one. To
           a non-developer that reads as an error, every time. It is a real
           diagnosis for a real failure, so it stays; it just must not be the
           first thing the owner sees on a working page. -->
      <p id="boot-slow" class="t-body prose alert" hidden>
        This is taking longer than it should. If nothing else appears, the app
        did not start — see the "Deploying" section of the project README.
      </p>
    </div>
    <!-- Classic script, not a module, and deliberately inline: it must survive
         the bundle failing to load at all, which is the failure it exists to
         report. Both successful paths (React mounting, and main.tsx writing a
         configuration error) replace every child of #root, so getElementById
         returns null by the time this fires and it does nothing. -->
    <script>
      setTimeout(function () {
        var slow = document.getElementById('boot-slow')
        if (slow) slow.hidden = false
      }, 5000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
